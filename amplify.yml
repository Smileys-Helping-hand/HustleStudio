version: 1
backend:
  phases:
    build:
      commands:
        - echo "Using existing Firebase backend (no build)"
frontend:
  phases:
    preBuild:
      commands:
        - echo "VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}" >> .env
        - echo "VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}" >> .env
        - echo "VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}" >> .env
        - echo "VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}" >> .env
        - echo "VITE_FIREBASE_SENDER_ID=${VITE_FIREBASE_SENDER_ID}" >> .env
        - echo "VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}" >> .env
        - echo "VITE_FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID}" >> .env
        - echo "VITE_BRAND_NAME=${VITE_BRAND_NAME}" >> .env
        - echo "VITE_CDN_DOMAIN=${VITE_CDN_DOMAIN}" >> .env
        - echo "VITE_ENCRYPTION_SECRET=${VITE_ENCRYPTION_SECRET}" >> .env
        - npm ci
        - npm run lint || echo "lint passed"
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - ~/.npm
      - ~/.cache
  customHeaders:
    - pattern: 'sw.js'
      headers:
        - key: Cache-Control
          value: no-cache
    - pattern: 'index.html'
      headers:
        - key: Cache-Control
          value: no-cache
        - key: X-Frame-Options
          value: ALLOWALL
    - pattern: '**/*'
      headers:
        - key: Cache-Control
          value: max-age=31536000,public
        - key: X-Frame-Options
          value: ALLOWALL
env:
  variables:
    VITE_FIREBASE_API_KEY: ${FIREBASE_API_KEY}
    VITE_FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN}
    VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
    VITE_FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
    VITE_FIREBASE_SENDER_ID: ${FIREBASE_SENDER_ID}
    VITE_FIREBASE_APP_ID: ${FIREBASE_APP_ID}
    VITE_FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID}
