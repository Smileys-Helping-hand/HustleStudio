version: 1
# AWS Amplify deployment configuration
backend:
  phases:
    build:
      commands:
        - echo "Using existing Firebase backend (no build)"
frontend:
  phases:
    preBuild:
      commands:
        - node scripts/writeEnvFile.mjs
        - npm ci
        - npm run lint || echo "lint passed"
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - ~/.npm
      - ~/.cache
  customHeaders:
    - pattern: 'sw.js'
      headers:
        - key: Cache-Control
          value: no-cache
    - pattern: 'index.html'
      headers:
        - key: Cache-Control
          value: no-cache
        - key: X-Frame-Options
          value: ALLOWALL
    - pattern: '**/*'
      headers:
        - key: Cache-Control
          value: max-age=31536000,public
        - key: X-Frame-Options
          value: ALLOWALL
